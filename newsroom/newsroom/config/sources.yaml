# Kaynak havuzu.
#
# Bu dosya yalnız NEREDEN toplandığını söyler. Bir kaynağın ne kadar iyi olduğu,
# ne sıklıkta kullanılabileceği ve hangi konularda tercih edileceği editoryal
# yargıdır ve POLICY.md icindedir.
#
# Eski configteki source_quality (trusted/usable/noisy/restricted) alanı bilerek
# taşınmadı: kaynak kalitesi sıralaması POLICY.md J1 kapsamındadır. Paywall ise
# ayrı bir alan gerektirmez; metin çıkarımı başarısız olursa aday zaten elenir.
#
# snippet_limit / fetch_snippets de taşınmadı: metin artık toplama sırasında
# değil, yalnız brief'e giren adaylar için çekilir.
