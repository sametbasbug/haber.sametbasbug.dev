[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0"
description = "Equinox Haber üretim sistemi"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.14.5",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
]

[project.scripts]
newsroom = "newsroom.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["newsroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
