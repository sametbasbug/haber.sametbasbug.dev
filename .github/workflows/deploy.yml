name: Deploy Haber to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haber-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: production
      url: https://haber.sametbasbug.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify publishing and design
        run: |
          npm run test:orbit
          npm run test:technology
          npm run test:newsroom-catalog
          npm run test:editorial-design
          npm run test:legacy-retirement
          npm run typecheck
      - name: Build production Worker
        env:
          PUBLIC_SITE_URL: https://haber.sametbasbug.dev
          PUBLIC_HABER_STAGING: 'false'
          PUBLIC_NEWS_SITE_URL: https://haber.sametbasbug.dev
        run: npm run build:ssr
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply haber --remote --config wrangler.ssr.jsonc
      - name: Deploy production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.ssr.jsonc
      - name: Verify live site
        run: |
          set -e
          for path in / /masa/ /kategori/yazilim/ /rss.xml /orbit-actions.json; do
            curl --fail --silent --show-error --max-time 15 -o /dev/null "https://haber.sametbasbug.dev$path"
          done
          test "$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://haber.sametbasbug.dev/arsiv/)" = 410
          test "$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://haber.sametbasbug.dev/microsoft-openai-bagimliligini-azaltmak-icin-kendi-yapay-zeka-modellerini-tanitti/)" = 404
          test "$(curl -s -m 15 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"operationId":"haber.haberleriOku","input":{"limit":1}}' https://haber.sametbasbug.dev/api/orbit-eylem)" = 401
