name: Haber Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install newsroom
        run: |
          python -m pip install --upgrade pip
          pip install -e newsroom[test]

      # Testler ağa çıkmaz ve sağlayıcı çağırmaz; ImageMagick gerektirenler
      # kurulu değilse kendiliğinden atlanır.
      - name: Run newsroom tests
        run: python -m pytest newsroom/tests

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Orbit kimlik katmanı: ID token doğrulaması (gerçek ES256 kriptosuyla)
      # ve giriş akışının reddetme kararları. `orbit-token-tests.mjs` yazıldığı
      # günden beri VARDI ama hiçbir yerden koşulmuyordu — koşulmayan test,
      # test değil belgedir.
      - name: Orbit identity tests
        run: npm run test:orbit

      # Tür kontrolü 2026-08-21'e kadar HİÇ koşmuyordu: tsconfig'deki
      # deprecated `baseUrl` TS 6'da hata verip tsc'yi daha başlamadan
      # düşürüyordu. Kaldırıldığında 14 gerçek hata çıktı; onikisi Worker
      # tiplerinin (`D1Database`, `R2Bucket`, `ExportedHandler`) hiç tanımlı
      # olmamasındandı.
      #
      # O tipleri `wrangler types` üretiyor ve `npm run typecheck` her koşuda
      # yeniden üretiyor — dosya depoda TUTULMUYOR. Bir kez commit'lemeyi
      # denedim ve CI düştü: üretilen içerik `.dev.vars`, `.env` ve `dist-ssr`
      # varlığına göre değişiyor, yani "güncel kopya" diye bir şey yok.
      - name: Typecheck
        run: npm run typecheck

      - name: Build Astro site
        env:
          PUBLIC_SITE_URL: https://haber.sametbasbug.dev
          PUBLIC_NEWS_SITE_URL: https://haber.sametbasbug.dev
          PUBLIC_MAIN_SITE_URL: https://sametbasbug.dev
          PUBLIC_NEWS_SUBDOMAIN_ENABLED: 'true'
        run: npm run build
